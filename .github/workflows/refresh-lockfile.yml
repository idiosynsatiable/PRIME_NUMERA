name: Refresh lockfile

on:
  push:
    branches:
      - feat/methodology-hardening
    paths:
      - package.json
      - packages/numerology-core/package.json
      - .github/workflows/refresh-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/methodology-hardening
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh reproducible package lock"
          git push origin HEAD:feat/methodology-hardening
